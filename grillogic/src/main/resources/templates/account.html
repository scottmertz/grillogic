<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GRILLOGIC — My Account</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-container">
    <div class="app-header">
        <img src="/img/logo.png" alt="GRILLOGIC" class="app-logo-img">
        <div class="app-nav">
            <a href="/dashboard" id="dashLink">Dashboard</a>
            <span id="userEmail"></span>
            <button id="logoutBtn" class="btn-link">Log Out</button>
        </div>
    </div>

    <div class="app-content">
        <h1>My Account</h1>

        <div class="card" style="max-width:420px;">
            <h2>Change Password</h2>
            <div class="error-message" id="errorMessage" style="display:none;"></div>
            <div id="successMessage" style="display:none; color:var(--status-good); font-weight:700; margin-bottom:16px;">
                Password updated successfully.
            </div>

            <div class="form-group">
                <label for="currentPassword">Current Password</label>
                <input type="password" id="currentPassword" required>
            </div>
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" required>
            </div>
            <button type="button" id="changePasswordBtn" class="btn-primary" style="width:auto; padding:10px 22px;">Update Password</button>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('grillogic_token');
    if (!token) window.location.href = '/login';
    document.getElementById('userEmail').textContent = localStorage.getItem('grillogic_email') || '';

    const role = localStorage.getItem('grillogic_role');
    document.getElementById('dashLink').href = role === 'ADMIN' ? '/admin' : '/dashboard';

    document.getElementById('logoutBtn').addEventListener('click', function() {
        localStorage.clear();
        window.location.href = '/login';
    });

    document.getElementById('changePasswordBtn').addEventListener('click', async function() {
        const errorBox = document.getElementById('errorMessage');
        const successBox = document.getElementById('successMessage');
        errorBox.style.display = 'none';
        successBox.style.display = 'none';

        const currentPassword = document.getElementById('currentPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (newPassword !== confirmPassword) {
            errorBox.textContent = 'New password and confirmation do not match.';
            errorBox.style.display = 'block';
            return;
        }

        const response = await fetch('/api/auth/change-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ currentPassword, newPassword })
        });

        if (response.ok) {
            successBox.style.display = 'block';
            document.getElementById('currentPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
        } else {
            const data = await response.json();
            errorBox.textContent = data.error || 'Failed to update password.';
            errorBox.style.display = 'block';
        }
    });
</script>

</body>
</html>
