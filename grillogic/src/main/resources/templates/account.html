<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GRILLOGIC — My Account</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-container">
    <div th:replace="~{fragments/nav :: nav}"></div>

    <div class="app-content">
        <h1>My Account</h1>

        <div class="card" id="teamCard" style="max-width:600px; display:none;">
            <h2>Team Members</h2>
            <p style="font-size:9.5pt; color:var(--mgray); margin-bottom:12px;">
                Give your GM or manager their own login. They'll see the same recipes, ingredients,
                vendors, and reports as you — just under their own email and password.
            </p>
            <table class="data-table" style="margin-bottom:16px;">
                <thead>
                <tr><th>Email</th><th>Role</th><th></th></tr>
                </thead>
                <tbody id="managersBody"></tbody>
            </table>
            <div class="inline-form">
                <div class="form-group">
                    <label for="newManagerEmail">Email</label>
                    <input type="email" id="newManagerEmail" placeholder="manager@example.com">
                </div>
                <div class="form-group">
                    <label for="newManagerPassword">Temporary Password</label>
                    <input type="password" id="newManagerPassword" placeholder="At least 8 characters">
                </div>
                <button type="button" id="addManagerBtn" class="btn-primary">Add Team Member</button>
            </div>
            <p id="managerError" style="display:none; color:var(--status-bad, #CC3300); font-size:8.5pt; margin-top:8px;"></p>
        </div>

        <div class="card" style="max-width:420px;">
            <h2>Change Password</h2>
            <div class="error-message" id="errorMessage" style="display:none;"></div>
            <div id="successMessage" style="display:none; color:var(--status-good); font-weight:700; margin-bottom:16px;">
                Password updated successfully.
            </div>

            <div class="form-group">
                <label for="currentPassword">Current Password</label>
                <input type="password" id="currentPassword" required>
            </div>
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" required>
            </div>
            <button type="button" id="changePasswordBtn" class="btn-primary" style="width:auto; padding:10px 22px;">Update Password</button>
        </div>
    </div>
</div>

<script src="/js/nav.js"></script>
<script>
    const token = localStorage.getItem('grillogic_token');

    async function loadManagers() {
        const response = await fetch('/api/account/managers', {
            headers: { 'Authorization': 'Bearer ' + token }
        });

        if (!response.ok) {
            document.getElementById('teamCard').style.display = 'none';
            return;
        }

        document.getElementById('teamCard').style.display = 'block';
        const managers = await response.json();
        const tbody = document.getElementById('managersBody');

        if (managers.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:var(--mgray);">No team members yet.</td></tr>';
        } else {
            tbody.innerHTML = managers.map(m => `
            <tr>
                <td>${m.email}</td>
                <td>${m.accountRole}</td>
                <td><button type="button" class="btn-link" onclick="removeManager(${m.id})">Remove</button></td>
            </tr>
        `).join('');
        }
    }

    document.getElementById('addManagerBtn').addEventListener('click', async function() {
        const errorEl = document.getElementById('managerError');
        errorEl.style.display = 'none';

        const email = document.getElementById('newManagerEmail').value.trim();
        const password = document.getElementById('newManagerPassword').value;

        if (!email || !password) {
            errorEl.textContent = 'Enter both an email and a password.';
            errorEl.style.display = 'block';
            return;
        }

        const response = await fetch('/api/account/managers', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ email, password })
        });

        if (response.ok) {
            document.getElementById('newManagerEmail').value = '';
            document.getElementById('newManagerPassword').value = '';
            loadManagers();
        } else {
            const data = await response.json().catch(() => ({}));
            errorEl.textContent = data.error || 'Failed to add team member.';
            errorEl.style.display = 'block';
        }
    });

    async function removeManager(id) {
        if (!confirm('Remove this team member? They will no longer be able to log in.')) return;
        const response = await fetch('/api/account/managers/' + id, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token }
        });
        if (response.ok) {
            loadManagers();
        } else {
            alert('Failed to remove team member.');
        }
    }

    document.getElementById('changePasswordBtn').addEventListener('click', async function() {
        const errorBox = document.getElementById('errorMessage');
        const successBox = document.getElementById('successMessage');
        errorBox.style.display = 'none';
        successBox.style.display = 'none';

        const currentPassword = document.getElementById('currentPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (newPassword !== confirmPassword) {
            errorBox.textContent = 'New password and confirmation do not match.';
            errorBox.style.display = 'block';
            return;
        }

        const response = await fetch('/api/auth/change-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ currentPassword, newPassword })
        });

        if (response.ok) {
            successBox.style.display = 'block';
            document.getElementById('currentPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
        } else {
            const data = await response.json();
            errorBox.textContent = data.error || 'Failed to update password.';
            errorBox.style.display = 'block';
        }
    });

    loadManagers();
</script>

</body>
</html>
