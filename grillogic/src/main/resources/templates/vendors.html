<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GRILLOGIC — Vendors</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-container">
    <div class="app-header">
        <img src="/img/logo.png" alt="GRILLOGIC" class="app-logo-img">
        <div class="app-nav">
            <a href="/ingredients">Ingredients</a>
            <a href="/vendors">Vendors</a>
            <a href="/invoice-capture">Invoice Capture</a>
            <a href="/recipes">+ New Recipe</a>
            <a href="/recipes/list">All Recipes</a>
            <span id="userEmail"></span>
            <button id="logoutBtn" class="btn-link">Log Out</button>
        </div>
    </div>

    <div class="app-content">
        <h1>Vendors</h1>

        <div class="card">
            <h2>Add Vendor</h2>
            <form id="addVendorForm" class="inline-form">
                <div class="form-group">
                    <label>Vendor Name</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label>Contact Name</label>
                    <input type="text" id="contactName">
                </div>
                <div class="form-group">
                    <label>Contact Email</label>
                    <input type="email" id="contactEmail">
                </div>
                <div class="form-group">
                    <label>Contact Phone</label>
                    <input type="text" id="contactPhone">
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <input type="text" id="notes">
                </div>
                <button type="submit" class="btn-primary">Add Vendor</button>
            </form>
        </div>

        <div class="card">
            <h2>All Vendors</h2>
            <table id="vendorsTable" class="data-table">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Contact Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Notes</th>
                    <th></th>
                </tr>
                </thead>
                <tbody id="vendorsBody">
                <!-- Filled in by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('grillogic_token');

    if (!token) {
        window.location.href = '/login';
    }

    document.getElementById('userEmail').textContent = localStorage.getItem('grillogic_email') || '';

    document.getElementById('logoutBtn').addEventListener('click', function() {
        localStorage.clear();
        window.location.href = '/login';
    });

    async function loadVendors() {
        const response = await fetch('/api/vendors', {
            headers: { 'Authorization': 'Bearer ' + token }
        });

        if (response.status === 401 || response.status === 403) {
            localStorage.clear();
            window.location.href = '/login';
            return;
        }

        const vendors = await response.json();
        const tbody = document.getElementById('vendorsBody');
        tbody.innerHTML = '';

        if (vendors.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#888;">No vendors yet.</td></tr>';
            return;
        }

        vendors.forEach(v => {
            const row = document.createElement('tr');
            row.innerHTML = `
            <td>${v.name}</td>
            <td>${v.contactName || '—'}</td>
            <td>${v.contactEmail || '—'}</td>
            <td>${v.contactPhone || '—'}</td>
            <td>${v.notes || '—'}</td>
            <td><button type="button" class="btn-link deleteBtn" data-id="${v.id}">Delete</button></td>
        `;
            tbody.appendChild(row);
        });

        document.querySelectorAll('.deleteBtn').forEach(btn => {
            btn.addEventListener('click', async function() {
                if (!confirm('Delete this vendor?')) return;
                const id = this.getAttribute('data-id');
                const response = await fetch('/api/vendors/' + id, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (response.ok) {
                    loadVendors();
                } else {
                    alert('Failed to delete vendor.');
                }
            });
        });
    }

    document.getElementById('addVendorForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const payload = {
            name: document.getElementById('name').value,
            contactName: document.getElementById('contactName').value,
            contactEmail: document.getElementById('contactEmail').value,
            contactPhone: document.getElementById('contactPhone').value,
            notes: document.getElementById('notes').value
        };

        const response = await fetch('/api/vendors', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify(payload)
        });

        if (response.ok) {
            document.getElementById('addVendorForm').reset();
            loadVendors();
        } else {
            alert('Failed to add vendor.');
        }
    });

    loadVendors();
</script>

</body>
</html>
